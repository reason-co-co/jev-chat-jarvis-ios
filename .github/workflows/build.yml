name: Build TrollStore IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # 作者用 Xcode 27 验证编译；Xcode 26.6 亦可
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Install ldid
        run: |
          curl -fL -o ldid https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macosx_arm64
          chmod +x ldid
          ls -lh ldid

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild -project JevJarvis.xcodeproj \
            -scheme JevJarvis \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Sign with ldid and package
        run: |
          set -e
          APP=build/Build/Products/Release-iphoneos/JevJarvis.app
          PRODUCTS=build/Build/Products/Release-iphoneos
          # embed 的 -remove-static-executable 会清空 PlugIns 里的 appex 二进制，从 Products 根目录重建
          rm -rf "$APP/PlugIns"
          mkdir -p "$APP/PlugIns"
          cp -R "$PRODUCTS/JevKeyboard.appex" "$APP/PlugIns/"
          cp -R "$PRODUCTS/JevLive.appex" "$APP/PlugIns/"
          # 先签扩展，再签主 App（注意：-S 与 entitlements 路径必须连写，不能有空格）
          ./ldid -SKeyboard/JevKeyboard.entitlements "$APP/PlugIns/JevKeyboard.appex/JevKeyboard"
          ./ldid -SBroadcast/JevLive.entitlements "$APP/PlugIns/JevLive.appex/JevLive"
          ./ldid -SApp/JevJarvis.entitlements "$APP/JevJarvis"
          # 打包 IPA
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -qry JevJarvis.ipa Payload
          ls -lh JevJarvis.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: JevJarvis-TrollStore
          path: JevJarvis.ipa
